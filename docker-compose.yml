# Base de datos para desarrollo local: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cmms
    ports:
      # 5433 en el PC para no chocar con un PostgreSQL instalado localmente
      - "5433:5432"
    volumes:
      - cmms-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  cmms-db:
